name: E2E Test

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Mirror website URL to test (stats.json)'
        required: false
        default: 'https://moonrockz.github.io/mooncakes-mirror'
      index_url:
        description: 'Git index URL to test (must support smart HTTP)'
        required: false
        default: 'https://github.com/moonrockz/mooncakes-index.git'

  # Run after pages deployment
  workflow_run:
    workflows: ["Deploy Registry to GitHub Pages"]
    types:
      - completed

# Current moon reads the registry endpoints from $MOON_HOME/config.json.
# Do not use MOONCAKES_REGISTRY: with moon from 2026-08 on, it makes moon
# shallow-clone <url>/git/index, and GitHub Pages cannot serve that.
env:
  SITE_URL: ${{ github.event.inputs.site_url || 'https://moonrockz.github.io/mooncakes-mirror' }}
  INDEX_URL: ${{ github.event.inputs.index_url || 'https://github.com/moonrockz/mooncakes-index.git' }}
  API_URL: https://mooncakes.io
  DOWNLOAD_URL: https://download.mooncakes.io

jobs:
  test:
    runs-on: ubuntu-latest
    # Only run if pages deployment succeeded, or on manual trigger
    if: |
      (github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: chawyehsu/setup-moonup@8b0340aa45016c02c776cbe42a7856b371e610bf # v1
        with:
          # Installs the toolchain. The moon shim selects it from the moonbit-version
          # file in the repo root (without that file it uses latest). Keep both the same.
          moonbit-version: '0.10.15+943464bfa'

      - name: Verify mirror website and index
        run: |
          echo "=== Testing stats.json at $SITE_URL ==="
          curl -sf "$SITE_URL/stats.json" | jq .

          echo "=== Testing shallow clone of $INDEX_URL (branch main) ==="
          git clone --depth 1 --single-branch --branch main --no-tags "$INDEX_URL" "$RUNNER_TEMP/index-check"
          git -C "$RUNNER_TEMP/index-check" log -1 --format='%H %cI %s'
          test -d "$RUNNER_TEMP/index-check/user"

      - name: Write moon registry config
        run: |
          MOON_HOME="${MOON_HOME:-$HOME/.moon}"
          mkdir -p "$MOON_HOME"
          jq -n --arg api "$API_URL" --arg index "$INDEX_URL" --arg download "$DOWNLOAD_URL" \
            '{api: $api, index: $index, download: $download}' > "$MOON_HOME/config.json"
          echo "Wrote $MOON_HOME/config.json:"
          cat "$MOON_HOME/config.json"

      - name: Update moon index from mirror
        working-directory: examples/hello-world
        run: |
          echo "Updating moon index from: $INDEX_URL"
          moon update
          echo "Moon update completed successfully"

      - name: Build example project
        working-directory: examples/hello-world
        run: |
          echo "Building example project..."
          moon build --target all
          echo "Build completed successfully"

      - name: Run example project
        working-directory: examples/hello-world
        run: |
          echo "Running example project..."
          moon run src
          echo "Run completed successfully"

      # Resolve a real package through the mirrored index. The archive comes
      # from DOWNLOAD_URL and must match the checksum in the index.
      - name: Add a package from the index
        run: |
          cp -R examples/hello-world "$RUNNER_TEMP/hello-world-dep"
          # Outside the repo, moonup cannot find the pin file in a parent directory
          cp moonbit-version "$RUNNER_TEMP/hello-world-dep/"
          cd "$RUNNER_TEMP/hello-world-dep"
          moon add moonbitlang/x@0.5.1
          moon build
          test -d .mooncakes/moonbitlang/x

      - name: Run tests (if any)
        working-directory: examples/hello-world
        continue-on-error: true
        run: |
          echo "Running tests..."
          moon test || echo "No tests to run"

      - name: Test Summary
        run: |
          {
            echo "## E2E Test Results"
            echo ""
            echo "- **Website**: \`$SITE_URL\`"
            echo "- **Index**: \`$INDEX_URL\`"
            echo "- **Status**: All tests passed"
            echo ""
            echo "### Verified"
            echo "- Website stats.json accessible"
            echo "- Index can be shallow-cloned (branch main, smart HTTP)"
            echo "- moon update works with \$MOON_HOME/config.json"
            echo "- A package resolves through the index and downloads"
            echo "- Example project builds and runs"
          } >> "$GITHUB_STEP_SUMMARY"

  test-matrix:
    runs-on: ${{ matrix.os }}
    needs: test
    # Only run the matrix on manual trigger to save CI time
    if: github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: chawyehsu/setup-moonup@8b0340aa45016c02c776cbe42a7856b371e610bf # v1
        with:
          # Installs the toolchain. The moon shim selects it from the moonbit-version
          # file in the repo root (without that file it uses latest). Keep both the same.
          moonbit-version: '0.10.15+943464bfa'

      - name: Write moon registry config
        run: |
          MOON_HOME="${MOON_HOME:-$HOME/.moon}"
          mkdir -p "$MOON_HOME"
          printf '{"api":"%s","index":"%s","download":"%s"}\n' \
            "$API_URL" "$INDEX_URL" "$DOWNLOAD_URL" > "$MOON_HOME/config.json"
          cat "$MOON_HOME/config.json"

      - name: Build example project
        working-directory: examples/hello-world
        run: |
          moon update
          moon build

      - name: Run example project
        working-directory: examples/hello-world
        run: moon run src
