name: Deploy Registry to GitHub Pages

on:
  # Run after mirror workflow completes
  workflow_run:
    workflows: ["Mirror Mooncakes Registry"]
    branches: [main]
    types:
      - completed

  # Also allow manual trigger
  workflow_dispatch:

# Allow only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if mirror workflow succeeded, or on manual trigger
    if: |
      (github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch')

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main branch (code)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # The index data lives in the public moonrockz/mooncakes-index repo
      # (branch main). The mirror workflow writes it; no secret is needed to
      # read it.
      - name: Checkout mooncakes-index (index data)
        uses: actions/checkout@v4
        with:
          repository: moonrockz/mooncakes-index
          ref: main
          path: mooncakes-index
          fetch-depth: 0

      # Pin the toolchain. An unpinned "latest" toolchain broke this build
      # on 2026-02-11. Update this version on purpose and test the build.
      - name: Setup MoonBit
        uses: chawyehsu/setup-moonup@8b0340aa45016c02c776cbe42a7856b371e610bf # v1
        with:
          # Installs the toolchain. The moon shim selects it from the moonbit-version
          # file in the repo root (without that file it uses latest). Keep both the same.
          moonbit-version: '0.10.15+943464bfa'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: main/package-lock.json

      # MoonBit dependencies are vendored (see vendor/README.md), so the
      # build does not use the registry. npm ci installs from the lock file.
      - name: Install dependencies
        working-directory: main
        run: |
          moon version --all
          npm ci

      # Build MoonBit first so that compiler errors fail this step. The
      # Vite plugin only logs them and then fails on a missing /main.js.
      - name: Check MoonBit sources
        working-directory: main
        run: moon build --target js --release

      - name: Build MoonBit site
        working-directory: main
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create pages directory structure
        run: |
          mkdir -p _site/git

          # Copy the Vite build output from main branch
          if [ -d "main/src/dist" ]; then
            cp -r main/src/dist/* _site/
            echo "Copied Vite build output"
          fi

          # Copy of the index for old moon clients only (before 2026-08),
          # served with the dumb HTTP protocol. Current moon CANNOT use it:
          # it clones with --depth 1, and dumb HTTP does not support shallow
          # fetches. Current clients use
          # https://github.com/moonrockz/mooncakes-index.git directly.
          git clone --bare mooncakes-index _site/git/index
          cd _site/git/index
          git update-server-info
          cd ../../..
          echo "Legacy git index prepared for dumb HTTP protocol"

          # Copy stats.json and yanked.json from mooncakes-index
          if [ -f "mooncakes-index/stats.json" ]; then
            cp mooncakes-index/stats.json _site/
            echo "Copied stats.json"
          fi

          if [ -f "mooncakes-index/yanked.json" ]; then
            cp mooncakes-index/yanked.json _site/
            echo "Copied yanked.json"
          fi

          # Copy yanked.html from main branch
          if [ -f "main/yanked.html" ]; then
            cp main/yanked.html _site/
            echo "Copied yanked.html"
          fi

          echo "=== Final site structure ==="
          find _site -type f | head -50
          echo ""
          echo "=== Git index info/refs ==="
          cat _site/git/index/info/refs || echo "refs not found"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "- **URL**: ${{ steps.deployment.outputs.page_url }}"
            echo "- **Index**: \`moonrockz/mooncakes-index\` (branch \`main\`)"
          } >> "$GITHUB_STEP_SUMMARY"
